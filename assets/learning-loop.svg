<svg xmlns="http://www.w3.org/2000/svg" width="420" height="368" viewBox="0 0 420 368" role="img" aria-labelledby="title desc">
  <title id="title">Así suelo aprender</title>
  <desc id="desc">Primero me hago preguntas; después pruebo cosas; finalmente anoto lo aprendido.</desc>
  <rect x="1" y="1" width="418" height="366" rx="18" fill="#101c2b" stroke="#35565e" stroke-width="1.5"/>
  <g font-family="DejaVu Sans, Arial, sans-serif">
    <rect x="22" y="20" width="376" height="92" rx="12" fill="#18303c" stroke="#3b6470"/>
    <text x="42" y="46" fill="#5eead4" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="13">01 / CURIOSIDAD</text>
    <text x="42" y="75" fill="#f1f5f9" font-size="19" font-weight="700">Me hago preguntas</text>
    <text x="42" y="96" fill="#b6c8d3" font-size="14">Empiezo por entender</text>
    <rect x="22" y="138" width="376" height="92" rx="12" fill="#18303c" stroke="#3b6470"/>
    <text x="42" y="164" fill="#5eead4" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="13">02 / EXPERIMENTO</text>
    <text x="42" y="193" fill="#f1f5f9" font-size="19" font-weight="700">Pruebo cosas</text>
    <text x="42" y="214" fill="#b6c8d3" font-size="14">Y averiguo qué falla</text>
    <rect x="22" y="256" width="376" height="92" rx="12" fill="#18303c" stroke="#3b6470"/>
    <text x="42" y="282" fill="#5eead4" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="13">03 / DOCUMENTO</text>
    <text x="42" y="311" fill="#f1f5f9" font-size="19" font-weight="700">Anoto lo aprendido</text>
    <text x="42" y="332" fill="#b6c8d3" font-size="14">Para la próxima vez</text>
  </g>
  <g stroke="#5eead4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M210 116 V132 M205 127 L210 132 L215 127"/>
    <path d="M210 234 V250 M205 245 L210 250 L215 245"/>
  </g>
</svg>