<svg xmlns="http://www.w3.org/2000/svg" width="760" height="164" viewBox="0 0 760 164" role="img" aria-labelledby="title desc">
  <title id="title">Así suelo aprender</title>
  <desc id="desc">Me da curiosidad, lo pruebo, lo documento y vuelvo a empezar.</desc>
  <rect x="1" y="1" width="758" height="162" rx="17" fill="#101c2b" stroke="#35565e" stroke-width="1.5"/>
  <g font-family="DejaVu Sans, Arial, sans-serif">
    <g>
      <rect x="20" y="21" width="218" height="107" rx="11" fill="#18303c" stroke="#3b6470"/>
      <text x="36" y="49" fill="#5eead4" font-family="DejaVu Sans Mono, monospace" font-size="13">01 / CURIOSIDAD</text>
      <text x="36" y="80" fill="#f1f5f9" font-size="17" font-weight="700">Me hago preguntas</text>
      <text x="36" y="105" fill="#a7bac9" font-size="12">Empiezo por entender</text>
    </g>
    <g>
      <rect x="271" y="21" width="218" height="107" rx="11" fill="#18303c" stroke="#3b6470"/>
      <text x="287" y="49" fill="#5eead4" font-family="DejaVu Sans Mono, monospace" font-size="13">02 / EXPERIMENTO</text>
      <text x="287" y="80" fill="#f1f5f9" font-size="17" font-weight="700">Pruebo cosas</text>
      <text x="287" y="105" fill="#a7bac9" font-size="12">Y averiguo qué falla</text>
    </g>
    <g>
      <rect x="522" y="21" width="218" height="107" rx="11" fill="#18303c" stroke="#3b6470"/>
      <text x="538" y="49" fill="#5eead4" font-family="DejaVu Sans Mono, monospace" font-size="13">03 / DOCUMENTO</text>
      <text x="538" y="80" fill="#f1f5f9" font-size="17" font-weight="700">Anoto lo aprendido</text>
      <text x="538" y="105" fill="#a7bac9" font-size="12">Para la próxima vez</text>
    </g>
  </g>
  <g fill="none" stroke="#5eead4" stroke-linecap="round" stroke-linejoin="round" stroke-width="2">
    <path d="M244 73 H265 M258 67 L265 73 L258 79"/>
    <path d="M495 73 H516 M509 67 L516 73 L509 79"/>
  </g>
  <text x="380" y="150" text-anchor="middle" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="11" fill="#91adbc">repetir cuando haga falta</text>
</svg>